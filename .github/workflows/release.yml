name: Release

# Release of a version tag vX.Y.Z, and a dry run of the same chain on the pull requests that touch
# the image or the release tooling (nothing published, read-only token).
#
# On a tag:
#  1. scripts/release.mjs check: the tag, package.json and package-lock.json, the image of
#     compose.yaml and of the README, the clone commands of the README and the CHANGELOG entry
#     agree on the version;
#  2. the image is built ONCE for linux/amd64 and linux/arm64 and pushed to
#     ghcr.io/hiteafr/tirelire BY DIGEST only: no tag points to it yet;
#  3. each platform of THAT digest is pulled back and goes through scripts/docker-proof.sh (first
#     start, healthcheck, login page, user from the command line, permissions, restart),
#     linux/arm64 under QEMU;
#  4. only then the tags X.Y.Z, X.Y, X and latest are set on the same digest (nothing rebuilt), a
#     signed build provenance is attached, the image is checked to be pullable without login, and
#     the GitHub release is created with the notes of the CHANGELOG entry.
# Actions and helper images are pinned by digest (the version is in the comment).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore
      - docker/**
      - compose.yaml
      - scripts/docker-proof.sh
      - scripts/release.mjs
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hiteafr/tirelire
  DESCRIPTION: Self-hosted personal finance app for bank CSV statements, categories, budgets, recurring payments and forecast
  BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version agrees everywhere, notes render
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          node scripts/release.mjs check "$v"
          node scripts/release.mjs notes "$v" > "$RUNNER_TEMP/notes.md"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build linux/amd64 (loaded, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          tags: tirelire-candidate:amd64

      - name: Proof linux/amd64
        env:
          TIRELIRE_PROOF_IMAGE: tirelire-candidate:amd64
          TIRELIRE_PROOF_PLATFORM: linux/amd64
          TIRELIRE_PROOF_VERSION: ${{ steps.version.outputs.version }}
          TIRELIRE_PROOF_REVISION: ${{ github.sha }}
        run: sh scripts/docker-proof.sh

      - name: Build linux/arm64 (loaded, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          tags: tirelire-candidate:arm64

      - name: Proof linux/arm64 (QEMU)
        env:
          TIRELIRE_PROOF_IMAGE: tirelire-candidate:arm64
          TIRELIRE_PROOF_PLATFORM: linux/arm64
          TIRELIRE_PROOF_VERSION: ${{ steps.version.outputs.version }}
          TIRELIRE_PROOF_REVISION: ${{ github.sha }}
          TIRELIRE_PROOF_WAIT: 600
        run: sh scripts/docker-proof.sh

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write           # GitHub release
      packages: write           # ghcr.io/hiteafr/tirelire
      id-token: write           # signed build provenance (Sigstore)
      attestations: write
      artifact-metadata: write  # storage record of the provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version of the tag agrees everywhere
        id: version
        run: |
          v=${GITHUB_REF_NAME#v}
          node scripts/release.mjs check "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 and linux/arm64, push by digest only (no tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.title=Tirelire
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=${{ env.DESCRIPTION }}
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Pull the digest back for each platform
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case $DIGEST in sha256:*) ;; *) echo "✗ no digest from the build"; exit 1 ;; esac
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "$IMAGE@$DIGEST"
            docker tag "$IMAGE@$DIGEST" "tirelire-candidate:$arch"
          done

      - name: Proof linux/amd64
        env:
          TIRELIRE_PROOF_IMAGE: tirelire-candidate:amd64
          TIRELIRE_PROOF_PLATFORM: linux/amd64
          TIRELIRE_PROOF_VERSION: ${{ steps.version.outputs.version }}
          TIRELIRE_PROOF_REVISION: ${{ github.sha }}
        run: sh scripts/docker-proof.sh

      - name: Proof linux/arm64 (QEMU)
        env:
          TIRELIRE_PROOF_IMAGE: tirelire-candidate:arm64
          TIRELIRE_PROOF_PLATFORM: linux/arm64
          TIRELIRE_PROOF_VERSION: ${{ steps.version.outputs.version }}
          TIRELIRE_PROOF_REVISION: ${{ github.sha }}
          TIRELIRE_PROOF_WAIT: 600
        run: sh scripts/docker-proof.sh

      - name: Tags on the proven digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          minor=${VERSION%.*}
          major=${VERSION%%.*}
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:$minor" --tag "$IMAGE:$major" --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
          for t in "$VERSION" "$minor" "$major" latest; do
            got=$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{json .Manifest}}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).digest))')
            [ "$got" = "$DIGEST" ] || { echo "✗ $IMAGE:$t is $got, $DIGEST expected"; exit 1; }
            echo "✓ $IMAGE:$t = $DIGEST"
          done

      - name: Build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # the run pulled the image with its own login: check that anyone can pull it. A new ghcr.io
      # package is private: make it public (package settings), then re-run the job.
      - name: Image pullable without login
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          repo=${IMAGE#ghcr.io/}
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).token||""))')
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/$repo/manifests/$VERSION" \
            || { echo "✗ $IMAGE:$VERSION cannot be pulled without login: make the package public, then re-run"; exit 1; }
          echo "✓ $IMAGE:$VERSION pullable without login"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release.mjs notes "$VERSION" --digest "$DIGEST" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "Tirelire $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
